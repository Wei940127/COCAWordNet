name: supabase-keepalive

# Supabase 免费版项目连续 7 天没有数据库活动就会被自动暂停，
# 暂停后登录和同步全部返回 540 错误，而且通常是在你几周后才发现的。
# 这个定时任务每两天发一次极轻量的查询，让项目一直保持活跃。
#
# 需要先在仓库里配置两个 Secrets（Settings → Secrets and variables → Actions）：
#   SUPABASE_URL       = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  = anon / publishable key
#
# 注意：GitHub 会在仓库连续 60 天没有任何提交活动后自动停用定时工作流。
# 所以如果这个运行变成红色、或者干脆不再运行，先去 Actions 页面手动 Run workflow 确认，
# 再检查 Secrets 和 Supabase 项目状态。

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::缺少 SUPABASE_URL 或 SUPABASE_ANON_KEY，请先到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

          code=$(curl -s -o body.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/progress?select=user_id&limit=1")

          echo "HTTP $code"
          cat body.txt || true
          echo

          if [ "$code" = "540" ]; then
            echo "::error::Supabase 项目已被暂停。请到 Supabase 后台选中该项目点 Resume project 恢复。"
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::意料之外的返回码 $code（检查 URL / key 是否正确）"
            exit 1
          fi

          echo "OK：项目处于活跃状态"
