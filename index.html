<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCAWordNet</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <div class="brandtxt">
      <b>COCAWordNet</b>
      <small>BNC/COCA 10000 词族 · 词网络学习</small>
    </div>
  </div>

  <div class="searchwrap">
    <input id="search" type="text" autocomplete="off" spellcheck="false"
           placeholder="搜索单词，如 act / happy / teacher（支持词族联想）">
    <div id="sugg" class="sugg hidden"></div>
  </div>

  <div class="controls">
    <select id="bandSel" title="词频层">
      <option value="0">全部词层</option>
      <option value="1">1k（最高频）</option>
      <option value="2">2k</option>
      <option value="3">3k</option>
      <option value="4">4k</option>
      <option value="5">5k</option>
      <option value="6">6k</option>
      <option value="7">7k</option>
      <option value="8">8k</option>
      <option value="9">9k</option>
      <option value="10">10k</option>
    </select>
    <select id="colorMode" title="节点着色">
      <option value="mastery">按掌握度</option>
      <option value="band">按词频层</option>
      <option value="flat">单色</option>
    </select>
    <button id="mapBtn" class="btn" title="按词层查看学习进度（快捷键 M）">▦ 进度地图</button>
    <button id="nextBtn" class="btn primary" title="随机跳到下一个未掌握的词（快捷键 N）">下一个词 ▸</button>
  </div>

  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="graphcol">
    <div class="graphtools">
      <button id="focusBtn" class="btn" title="清除其他节点，只看当前词的关系">◎ 聚焦当前词</button>
      <button id="clearBtn" class="btn" title="清空画布">✕ 清空</button>
      <span id="trail" class="trail"></span>
      <span class="hint">点击节点展开 · 滚轮缩放 · 拖拽平移</span>
    </div>
    <svg id="graph"><defs>
      <filter id="fwGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs></svg>
    <div id="legend" class="legend"></div>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="emptyState" class="empty">
      <div class="emptyCard">
        <h2>从一个词开始，织出你的词网</h2>
        <p>在上方搜索一个单词，或点击「下一个词」。<br>
        每个词会自动展开它的<b>同义词、反义词、上下位词、同族派生词、语义近邻</b>，<br>
        点开任意节点继续向外扩展，像滚雪球一样把相关词连成一片。</p>
        <div class="quick">
          <span>试试这些：</span>
          <button data-w="act">act</button>
          <button data-w="beautiful">beautiful</button>
          <button data-w="government">government</button>
          <button data-w="technology">technology</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div class="placeholder" id="ph">
      <p>选中一个节点查看<br>释义 · 词族 · 掌握度</p>
    </div>
    <div class="detail hidden" id="detail">
      <div class="dhead">
        <div class="dtitle">
          <h1 id="dWord"></h1>
          <button id="dSpeak" class="speakbtn" title="播放美式发音（快捷键 P）" aria-label="播放美式发音">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
        <div class="dmeta">
          <span id="dPhon" class="phon" title="点击播放美式发音"></span>
          <span id="dBand" class="chip"></span>
          <span id="dTags" class="tags"></span>
        </div>
      </div>

      <div class="mastery">
        <button class="mbtn" data-s="0">○ 未学</button>
        <button class="mbtn" data-s="1">◐ 学习中</button>
        <button class="mbtn" data-s="2">● 已掌握</button>
      </div>

      <div class="block">
        <h3>释义</h3>
        <div id="dTrans" class="trans"></div>
        <div id="dDef" class="def"></div>
      </div>

      <div class="block" id="bMorph" style="display:none">
        <h3>词根拆解 <small id="dMorphNote"></small></h3>
        <div id="dMorph" class="morph"></div>
        <div id="dCogn" class="cogn"></div>
      </div>

      <div class="block" id="bColl" style="display:none">
        <h3>高频搭配 <small>点击发音</small></h3>
        <div id="dColl" class="coll"></div>
      </div>

      <div class="block">
        <h3>词族 <small id="dFamNote"></small></h3>
        <div id="dFam" class="fam"></div>
      </div>

      <div class="block">
        <h3>关系词</h3>
        <div id="dRel" class="rel"></div>
      </div>
    </div>
  </aside>
</main>

<div id="mapModal" class="modal hidden">
  <div class="modalCard">
    <div class="mhead">
      <b>进度地图 <small id="mapSub"></small></b>
      <button id="mapClose" class="mclose" title="关闭">✕</button>
    </div>
    <div id="mapBody"></div>
    <div class="mfoot">点击任意词层，直接跳到该层开始学习 · 绿=已掌握 · 琥珀=学习中 · 灰=未学</div>
  </div>
</div>

<script src="d3.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
